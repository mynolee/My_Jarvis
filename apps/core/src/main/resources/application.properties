spring.application.name=my-jarvis-core
spring.datasource.url=${JARVIS_DB_URL:jdbc:postgresql://127.0.0.1:5432/jarvis}
spring.datasource.username=${JARVIS_DB_USER:jarvis_app}
spring.datasource.password=${JARVIS_DB_PASSWORD:}
spring.flyway.enabled=true
server.address=127.0.0.1
server.port=8080
server.forward-headers-strategy=none
server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.log-request-details=false
jarvis.mode=mock
jarvis.origin=${JARVIS_ORIGIN:https://localhost:8443}
jarvis.key-file=${JARVIS_KEY_FILE:}
jarvis.worker.enabled=true

# Keep the main business pool bounded; nonce reservation uses its own maximum-two pool.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000

# Optional text-only local inference. All real values belong in ignored .env/private mounts.
jarvis.local.enabled=${JARVIS_LOCAL_ENABLED:false}
jarvis.local.url=${JARVIS_LOCAL_URL:https://localhost:9443}
jarvis.local.manifest-hash=${JARVIS_LOCAL_MANIFEST_HASH:}
jarvis.local.client-cert-file=${JARVIS_LOCAL_CLIENT_CERT_FILE:}
jarvis.local.client-key-file=${JARVIS_LOCAL_CLIENT_KEY_FILE:}
jarvis.local.ca-file=${JARVIS_LOCAL_CA_FILE:}
jarvis.local.signing-key-file=${JARVIS_LOCAL_SIGNING_KEY_FILE:}
jarvis.local.signing-key-id=${JARVIS_LOCAL_SIGNING_KEY_ID:core-local-v1}

jarvis.web.enabled=${JARVIS_WEB_ENABLED:false}

# Durable conversation reads and scoped reconnect cursors.
jarvis.history.enabled=true
